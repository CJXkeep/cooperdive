# 大秦铁路防御-补跌监控（daqin-monitor）· 阈值与参数配置
# 位置：daqin/thresholds.yaml（合并入 CopperPrice 仓库后）
# 文档：docs/daqin/03-指标与信号设计.md §5、docs/daqin/02-数据层设计.md §5
#
# 约定：
#   1. 全部阈值为示例初始值，以 docs/daqin/04 回测校准结果为准；
#   2. 校准后写回本文件，并在下方 change_log 记录日期与依据；
#   3. 代码不得内嵌阈值，一律从本文件读取。
# 日期：2026-09-20 初版（未校准）
# 修订：2026-09-20 v0.2 —— 按 docs/daqin/06 设计决议调整：
#   D-01 FRED 免 key、D-02 秦皇岛库存改可选开关、D-04 移除旬度口径、
#   D-05 煤价改 ZC 期货代理、D-07 电厂口径统一沿海六大电、D-17 hist_start 提前
# 修订：2026-09-20 v0.3 —— 06 D-22 新增 repair.pp_avail_normal_days（S5 自动核）

macro:
  us10y_high: 5.0              # M1 升级阈值
  us10y_low_release: 4.8       # M1 解除阈值（滞回）
  s1_timeout_days: 60          # S1 停留超此天数且无 D/K 恶化则回 S0
  us10y_20d_chg_alert_bp: 30   # M2（辅助）
  spread_inferior: 0.0         # M3 倒挂（辅助）
  spread_advantage: 1.5        # 有比价优势（辅助）
  csi300_drawdown_20d: -10     # M4

demand:
  # 06 §D-02：秦皇岛库存无免费自动源，降级为「可选增强」子集；默认关闭，开箱即用
  # 打开后需在 daqin/manual_data/industry_weekly.csv 手工周录
  qhd_enabled: false
  qhd_inv_warn: 780            # D1 warn（万吨）
  qhd_inv_danger: 800          # D1 danger（2008 触发值）
  qhd_inv_level_release: 720   # 降级阈值（滞回）
  qhd_inv_wow_pct: 5.0         # D2
  qhd_inv_wow_weeks: 2
  qhd_inv_yoy_pct: 20.0        # D3
  # 06 §D-04：旬度运量免费源不存在，已移除 dq_vol_yoy_warn（原旬度口径）
  dq_vol_yoy_danger: 0.0       # D4 月度同比转负（自动核）
  # 06 §D-07：电厂口径统一为沿海六大电（ak.macro_china_daily_energy，2016-01-01 起）
  energy_scope: 沿海六大电
  pp_available_days_high: 25   # D5 电厂可用天数过高（自动核）

coal:                          # 06 §D-05：BSPI 不可得，用 ZC 期货主连做煤价粗代理
  zc_min_volume_ratio: 0.3     # 成交额低于 20 日均该比例 → 视为无效主力，煤价信号禁用
  zc_dev_20d_pct: -10.0        # D6 代理阈值：收盘低于 20 日均价 10% 视为煤价走弱

market:
  rs_20d_turn_negative: 0.0    # K1
  rs_60d_lookback_peak: 5.0
  single_day_drop_pct: 5.0     # K2
  volume_ratio_confirm: 1.5
  ma_break: MA60               # K3
  ma_below_days: 3

bottom:
  pb_below: 0.60               # K5
  div_yield_above: 5.5
  decline_narrowing_months: 2  # 运量降幅连续收窄月数

repair:
  inventory_down_weeks: 4      # S5 库存连续下降周数（qhd 增强项，仅 qhd_enabled 时参与）
  # 06 §D-22：S5 自动核——电厂可用天数回落至该值以下视为需求恢复正常（默认口径下 S5 的可达性依赖本键）
  pp_avail_normal_days: 20
  # 06 §D-29：S5 → S0「回补满」——每 N 个交易日回补一步 position.s4_rebuild_step，走满即回 S0
  rebuild_step_days: 5

debounce:
  daily_confirm_days: 2        # 日频规则连续成立天数

position:                      # 示例仓位，仅参考
  base: 0.60
  s2_reduce_ratio: 0.33
  s3_floor: 0.20
  s4_rebuild_step: 0.10

data:
  # 06 §D-01：改用免 key 的 fredgraph.csv 端点，不引入 fredapi 依赖
  fred_csv_endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv
  fred_series:
    us10y: DGS10
    us10y_real: DFII10
    us10y_ie: T10YIE
  fred_api_key_env: FRED_API_KEY   # 保留但默认不使用；仅调用官方 FRED API 时才需要
  hist_start: "2006-01-01"         # 06 §D-17：601006 于 2006-08 上市，取此起点预留 120 日 warm-up
  manual_data_dir: daqin/manual_data

change_log: []                 # 校准记录：[{date, param, old, new, basis}]
