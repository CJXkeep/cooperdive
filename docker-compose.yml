services:
  dashboard:
    build: .
    container_name: copper-dashboard
    command: streamlit run copper/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - TZ=Asia/Shanghai
      - COPPER_DATA_DIR=/app/data
      - COPPER_EVENTS_DIR=/app/events
    volumes:
      - ./data:/app/data
      - ./events:/app/events
    ports:
      # 仅本机回环访问；正式通过 caddy 走域名+HTTPS，见 README
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  scheduler:
    build: .
    container_name: copper-scheduler
    environment:
      - TZ=Asia/Shanghai
      - COPPER_DATA_DIR=/app/data
      - COPPER_EVENTS_DIR=/app/events
    volumes:
      - ./data:/app/data
      - ./events:/app/events
    restart: unless-stopped
    depends_on:
      - dashboard

  # 正式对外：域名 + 自动 HTTPS + 基础认证。本地调试用 `docker compose up dashboard scheduler` 即可。
  caddy:
    image: caddy:2-alpine
    container_name: copper-caddy
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
      - CADDY_HASH=${CADDY_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - dashboard

volumes:
  caddy_data:
  caddy_config:
